name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: guard tests
        run: python3 claude/hooks/test_guard.py && python3 claude/hooks/test_guard_extra.py
      - name: no personal info outside personal/
        run: python3 tests/check_no_personal.py
      - name: identity hooks
        run: bash tests/test_identity.sh
      - name: cron-install personal/ crontab
        run: bash tests/test_cron_install.sh
      - name: install profiles
        run: bash tests/test_install.sh
      - name: shellcheck
        run: bash tests/test_shellcheck.sh
      - name: powershell parses
        run: bash tests/test_powershell.sh
      - name: repos-doctor
        run: bash tests/test_repos_doctor.sh
      - name: ssh-keys-sync
        run: bash tests/test_ssh_keys_sync.sh
      - name: ruff
        run: bash tests/test_ruff.sh
      - name: windows scripts check out as CRLF
        run: bash tests/test_eol.sh
      - name: powershell scripts are ascii
        run: bash tests/test_ps1_ascii.sh
      - name: update prints its steps
        run: (command -v zsh || sudo apt-get install -y zsh) && bash tests/test_update_steps.sh
